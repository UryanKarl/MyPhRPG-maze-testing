# .github/workflows/deploy.yml
name: Deploy HTML Game to Pages

on:
  # 当代码推送到 main 分支时自动触发
  push:
    branches: ["main"]
  # 允许你手动在 Actions 页面点击按钮触发
  workflow_dispatch:

# 设置必要的权限，让 GitHub Pages 有权限写入
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同时只有一个部署任务在运行，避免冲突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 构建任务（因为你是纯静态，只需要把文件打包上传）
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 设置 10 分钟超时，防止卡死
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5  # 已升级到 v5，解决警告

      - name: 配置 Pages 环境
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # 上传整个仓库根目录（你的 html 文件就在根目录）

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # 使用最新部署工具